name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # build/typecheck-er jonno dummy value; real DB lagbe na
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret
      NEXTAUTH_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
